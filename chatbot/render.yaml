services:
  - type: web
    name: fun-chat-bot
    env: python
    plan: free
    rootDir: .
    buildCommand: |
      python -m pip install --upgrade pip
      pip install --clear-cache -r requirements.txt
    startCommand: PYTHONPATH=. uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: PYTHONPATH
        value: "."
      - key: PYTHON_VERSION
        value: "3.11.9"
