services:
  - type: web
    name: pharmalens-backend
    env: python
    plan: free
    region: oregon
    rootDir: .
    buildCommand: "python -m pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn backendd.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "https://pharmalens-frontend.netlify.app,http://localhost:5173,http://127.0.0.1:5173"
